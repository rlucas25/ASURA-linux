color1 = '#97ccf9'
color2 = '#003450'
color3 = '#c1c7ce'
color4 = '#1c2024'
color5 = '#003450'
color6 = '#101417'
color7 = '#101417'
color8 = '#97ccf9'
color9 = '#d0bfe7'

blue      = '#97ccf9'
red       = '#ffb4ab'
green     = '#d0bfe7'
yellow    = '#b8c8d9'
cyan      = '#97ccf9'
magenta   = '#d0bfe7'
white     = '#e0e3e8'
black     = '#101417'

rosewater = '#d0bfe7'
flamingo  = '#ffb4ab'
pink      = '#d0bfe7'
mauve     = '#4d4162'
maroon    = '#93000a'
peach     = '#b8c8d9'
teal      = '#394856'
sky       = '#97ccf9'
sapphire  = '#97ccf9'
lavender  = '#b8c8d9'

text      = '#e0e3e8'
subtext1  = '#c1c7ce'
