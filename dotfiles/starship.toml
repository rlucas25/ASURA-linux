overlay2  = '#8b9198'
overlay1  = '#41474d'
overlay0  = '#313539'
surface2  = '#262a2e'
surface1  = '#1c2024'
surface0  = '#181c20'
base      = '#101417'
mantle    = '#101417'
crust     = '#0b0f12'

[character]
success_symbol = "[❯](color9 bold)"
error_symbol = "[❯](@{error})"
vicmd_symbol = "[🞈](#f9e2af)"


[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = " Downloads"
"Music" = " Music"
"Pictures" = "  Pictures"

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[time]
format = "[](fg:color8 bg:color4)[ ](bg:color8 fg:color5)[](fg:color8 bg:color4)[(bg:color8 fg:color5) $time](fg:color3 bg:color4)[](fg:color4) "
disabled = false
time_format = "%R"

[python]
format = "[](fg:color8 bg:color4)[${symbol}${version}](bg:color8 fg:color5)[](fg:color8 bg:color4)[(bg:color8 fg:color5)( ${virtualenv})](fg:color3 bg:color4)[](fg:color4) "
symbol = '🐍'
pyenv_prefix = 'venv'


