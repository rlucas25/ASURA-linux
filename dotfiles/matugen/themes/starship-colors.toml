format = '''
$directory$git_branch$rust$python
$character'''

palette = 'asura'

[palettes.asura]
mustard = '#af8700'
color1 = '{{colors.primary_fixed_dim.default.hex}}'
color2 = '{{colors.on_primary.default.hex}}'
color3 = '{{colors.on_surface_variant.default.hex}}'
color4 = '{{colors.surface_container.default.hex}}'
color5 = '{{colors.on_primary.default.hex}}'
color6 = '{{colors.surface_dim.default.hex}}'
color7 = '{{colors.surface.default.hex}}'
color8 = '{{colors.primary.default.hex}}'
color9 = '{{colors.tertiary.default.hex}}'

blue      = '{{colors.primary.default.hex}}'
red       = '{{colors.error.default.hex}}'
green     = '{{colors.tertiary.default.hex}}'
yellow    = '{{colors.secondary.default.hex}}'
cyan      = '{{colors.primary_fixed_dim.default.hex}}'
magenta   = '{{colors.tertiary_fixed_dim.default.hex}}'
white     = '{{colors.on_surface.default.hex}}'
black     = '{{colors.surface.default.hex}}'

rosewater = '{{colors.tertiary.default.hex}}'
flamingo  = '{{colors.error.default.hex}}'
pink      = '{{colors.tertiary_fixed_dim.default.hex}}'
mauve     = '{{colors.tertiary_container.default.hex}}'
maroon    = '{{colors.error_container.default.hex}}'
peach     = '{{colors.secondary.default.hex}}'
teal      = '{{colors.secondary_container.default.hex}}'
sky       = '{{colors.primary_fixed_dim.default.hex}}'
sapphire  = '{{colors.primary.default.hex}}'
lavender  = '{{colors.secondary_fixed_dim.default.hex}}'

text      = '{{colors.on_surface.default.hex}}'
subtext1  = '{{colors.on_surface_variant.default.hex}}'
subtext0  = '{{colors.outline.default.hex}}'

overlay2  = '{{colors.outline.default.hex}}'
overlay1  = '{{colors.outline_variant.default.hex}}'
overlay0  = '{{colors.surface_container_highest.default.hex}}'
surface2  = '{{colors.surface_container_high.default.hex}}'
surface1  = '{{colors.surface_container.default.hex}}'
surface0  = '{{colors.surface_container_low.default.hex}}'
base      = '{{colors.surface.default.hex}}'
mantle    = '{{colors.surface_dim.default.hex}}'
crust     = '{{colors.surface_container_lowest.default.hex}}'

[character]
success_symbol = "[🞈](color9 bold)"
error_symbol = "[🞈](@{error})"
vicmd_symbol = "[🞈](#f9e2af)"

[directory]
format = "[](fg:color1 bg:color4)[󰉋](bg:color1 fg:color2)[ ](fg:color1 bg:color4)[$path ](fg:color3 bg:color4)[ ](fg:color4)"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
format = "[](fg:color8 bg:color4)[ ](bg:color8 fg:color5)[](fg:color8 bg:color4)[(bg:color8 fg:color5) $branch](fg:color3 bg:color4)[](fg:color4) "

[time]
format = "[](fg:color8 bg:color4)[ ](bg:color8 fg:color5)[](fg:color8 bg:color4)[(bg:color8 fg:color5) $time](fg:color3 bg:color4)[](fg:color4) "
disabled = false
time_format = "%R"

[python]
format = "[](fg:color8 bg:color4)[${symbol}${version}](bg:color8 fg:color5)[](fg:color8 bg:color4)[(bg:color8 fg:color5)( ${virtualenv})](fg:color3 bg:color4)[](fg:color4) "
symbol = '🐍'
pyenv_prefix = 'venv'

[aws]
symbol = "  "

[buf]
symbol = " "

[c]
symbol = " "

